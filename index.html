<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebulon</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="blob-container">
    <div class="blob1"></div>
    <div class="blob2"></div>
</div>

<main>
    <section id="hero">
        <div class="hero-content">
            <h1 id="hero-title"></h1>
            <p id="hero-desc"></p>
            <a href="#projects" class="cta-button" id="view-projects-btn">Projelerimizi Gör</a>
        </div>
    </section>

    <section id="skills" class="container reveal">
        <h2>Yeteneklerimiz</h2>
        <div class="skills-grid" id="skills-grid"></div>
    </section>

    <section id="projects" class="container reveal">
        <h2>Projelerimiz</h2>
        <div class="projects-grid" id="projects-grid"></div>
    </section>

    <section id="contact" class="container reveal">
        <h2>İletişim</h2>
        <div class="contact-links" id="contact-links"></div>
    </section>
</main>

<footer>
    <p id="footer-text">&copy; 2025 Nebulon Tüm hakları saklıdır.</p>
</footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
